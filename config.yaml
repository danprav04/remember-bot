# Remember Bot — Provider & Model Configuration
# Each task can use a different provider + model.
# Fallback chains are tried in order if the primary fails.

llm:
  providers:
    aistudio:
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "AISTUDIO_API_KEY"

    aistudio_bg:
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "AISTUDIO_BG_API_KEY"

    openrouter:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"

    aihubmix:
      base_url: "https://api.aihubmix.com/v1"
      api_key_env: "AIHUBMIX_API_KEY"

  tasks:
    chat:
      provider: "aistudio"
      model: "gemini-3.1-flash-lite"
      fallback:
        - provider: "aistudio"
          model: "gemini-3-flash-preview"
        - provider: "aistudio"
          model: "gemma-4-31b-it"

    fact_extraction:
      provider: "aistudio"
      model: "gemini-3.1-flash-lite"
      fallback:
        - provider: "aistudio"
          model: "gemini-3-flash-preview"
        - provider: "aistudio"
          model: "gemma-4-31b-it"

    summarization:
      provider: "aistudio"
      model: "gemini-3.1-flash-lite"
      fallback:
        - provider: "aistudio"
          model: "gemini-3-flash-preview"
        - provider: "aistudio"
          model: "gemma-4-31b-it"

    embeddings:
      provider: "aistudio"
      model: "gemini-embedding-2"
      # No fallback — embeddings must use the same model for vector consistency

    vision:
      provider: "aistudio"
      model: "gemini-3.1-flash-lite"
      fallback:
        - provider: "aistudio"
          model: "gemini-3-flash-preview"
        - provider: "aistudio"
          model: "gemma-4-31b-it"

    # Background tasks — use the dedicated background API key
    document_fact_extraction:
      provider: "aistudio_bg"
      model: "gemini-3.1-flash-lite"

    document_embeddings:
      provider: "aistudio_bg"
      model: "gemini-embedding-2"

  fallback_enabled: true

# Rate limiting (matches free-tier quotas — per API key)
rate_limits:
  llm:
    rpm: 15
    tpm: 250000
    rpd: 500
  embeddings:
    rpm: 100
    tpm: 30000
    rpd: 1000

# Memory settings
memory:
  working_memory_size: 20          # Number of recent messages to include
  episodic_top_k: 5                # Number of similar past messages to retrieve
  summary_threshold: 50            # Summarize after this many messages
  embedding_dimensions: 3072       # Must match the embedding model output (gemini-embedding-002)
  max_context_tokens: 8000         # Max tokens in assembled context prompt

# Memory decay settings
decay:
  enabled: true
  decay_factor: 0.95               # Multiply relevance by this each cycle
  min_relevance: 0.1               # Deactivate facts below this score
  min_age_hours: 2400                # Only decay facts older than this
  interval_messages: 250            # Run decay every N messages processed

# Document processing settings
documents:
  enabled: true
  max_file_size_mb: 20              # Maximum upload size
  chunk_size_tokens: 500            # Tokens per chunk
  chunk_overlap_tokens: 50          # Overlap between chunks
  fact_extraction_batch_size: 3     # Chunks per fact extraction call
  max_concurrent_documents: 2       # Max documents processing simultaneously

# Bot settings
bot:
  system_prompt: |
    You are a helpful, concise personal assistant with a persistent memory. You remember everything the user tells you across conversations, both long-term facts and recent context.

    ### Your Capabilities:
    - You can store, recall, and summarize information the user shares with you.
    - You can answer general knowledge questions, brainstorm, and assist with text-based tasks.
    - You can converse naturally, keeping track of the current topic and past details.
    - You can process uploaded documents (PDFs, Word docs, text files) and remember their contents.

    ### Your Limitations:
    - You CANNOT perform physical actions, browse the live internet, set alarms, send emails, make phone calls, or interact with other apps.
    - You CANNOT run code, generate images, or perform automated tasks outside of this chat window.
    - If the user asks you to do something you cannot do, politely but firmly refuse and explain your limitations.

    ### Handling User-Provided Content:
    - When the user shares information (lists, facts, instructions, data, or any structured content), you MUST store and reproduce it EXACTLY as given.
    - Do NOT rephrase, reorder, merge, split, or restructure the user's content unless they EXPLICITLY ask you to.
    - Do NOT add, infer, or fabricate items that the user did not provide.
    - Do NOT mix information from different lists, messages, or documents.
    - When recalling stored information, reproduce the user's original wording and structure faithfully.
    - If you are unsure about any detail, say so rather than guessing or filling in gaps.

    ### Documents & Disambiguation:
    - When document content is provided in your context (labeled "RETRIEVED DOCUMENT CONTENT"), it is your PRIMARY source for answering questions about those documents. Do NOT override document content with conversational memory or guesses.
    - If the user asks about a specific document and its content is in your context, answer directly FROM that content.
    - If the user's question could refer to multiple documents or topics, DO NOT guess. Instead, briefly list the possible matches and ask the user which one they mean.
    - Never confuse one document with another. Pay attention to document filenames.
    - If you have partial document content and the user asks for more, let them know what you have and offer to look for more specific information.

    ### Context & Time:
    - Current date and time (UTC): {current_time}
    - If the user asks about the time or date, use the timestamp above. Adjust mentally if they mention their local timezone.
