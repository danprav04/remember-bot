# Remember Bot — Provider & Model Configuration
# Each task can use a different provider + model.
# Fallback chains are tried in order if the primary fails.

llm:
  providers:
    aistudio:
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "AISTUDIO_API_KEY"

    openrouter:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"

    aihubmix:
      base_url: "https://api.aihubmix.com/v1"
      api_key_env: "AIHUBMIX_API_KEY"

  tasks:
    chat:
      provider: "aistudio"
      model: "gemini-3.1-flash-lite"
      fallback:
        - provider: "aistudio"
          model: "gemini-3-flash-preview"
        - provider: "aistudio"
          model: "gemma-4-31b-it"

    fact_extraction:
      provider: "aistudio"
      model: "gemini-3.1-flash-lite"
      fallback:
        - provider: "aistudio"
          model: "gemini-3-flash-preview"
        - provider: "aistudio"
          model: "gemma-4-31b-it"

    summarization:
      provider: "aistudio"
      model: "gemini-3.1-flash-lite"
      fallback:
        - provider: "aistudio"
          model: "gemini-3-flash-preview"
        - provider: "aistudio"
          model: "gemma-4-31b-it"

    embeddings:
      provider: "aistudio"
      model: "gemini-embedding-2"
      # No fallback — embeddings must use the same model for vector consistency

    vision:
      provider: "aistudio"
      model: "gemini-3.1-flash-lite"
      fallback:
        - provider: "aistudio"
          model: "gemini-3-flash-preview"
        - provider: "aistudio"
          model: "gemma-4-31b-it"

  fallback_enabled: true

# Memory settings
memory:
  working_memory_size: 20          # Number of recent messages to include
  episodic_top_k: 5                # Number of similar past messages to retrieve
  summary_threshold: 50            # Summarize after this many messages
  embedding_dimensions: 3072       # Must match the embedding model output (gemini-embedding-002)
  max_context_tokens: 8000         # Max tokens in assembled context prompt

# Memory decay settings
decay:
  enabled: true
  decay_factor: 0.95               # Multiply relevance by this each cycle
  min_relevance: 0.1               # Deactivate facts below this score
  min_age_hours: 2400                # Only decay facts older than this
  interval_messages: 250            # Run decay every N messages processed

# Bot settings
bot:
  system_prompt: |
    You are a helpful, concise personal assistant with a persistent memory. You remember everything the user tells you across conversations, both long-term facts and recent context.

    ### Your Capabilities:
    - You can store, recall, and summarize information the user shares with you.
    - You can answer general knowledge questions, brainstorm, and assist with text-based tasks.
    - You can converse naturally, keeping track of the current topic and past details.

    ### Your Limitations:
    - You CANNOT perform physical actions, browse the live internet, set alarms, send emails, make phone calls, or interact with other apps.
    - You CANNOT run code, generate images, or perform automated tasks outside of this chat window.
    - If the user asks you to do something you cannot do, politely but firmly refuse and explain your limitations.

    ### Context & Time:
    - Current date and time (UTC): {current_time}
    - If the user asks about the time or date, use the timestamp above. Adjust mentally if they mention their local timezone.
