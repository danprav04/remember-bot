name: Backup Production Database

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  DEPLOY_PATH: "/opt/rememberbot"

jobs:
  backup-production-db:
    name: Backup production PostgreSQL database
    runs-on: ubuntu-latest
    environment: production
    permissions: {}

    steps:
      - name: Set up SSH key for server access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        env:
          TARGET_SSH_HOST: ${{ secrets.SSH_HOST }}
        run: ssh-keyscan -H "${TARGET_SSH_HOST}" >> ~/.ssh/known_hosts
        shell: bash

      - name: Dump and compress production database
        env:
          TARGET_SSH_HOST: ${{ secrets.SSH_HOST }}
          TARGET_SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          BACKUP_FILE="rememberbot-prod-db-${TIMESTAMP}.sql.gz"
          REMOTE_CMD="set -euo pipefail"
          REMOTE_CMD="${REMOTE_CMD}; cd '${{ env.DEPLOY_PATH }}'"
          REMOTE_CMD="${REMOTE_CMD} && sudo docker compose exec -T db"
          REMOTE_CMD="${REMOTE_CMD} pg_dump -U 'bot' -d 'rememberbot'"
          ssh "${TARGET_SSH_USER}@${TARGET_SSH_HOST}" \
            "${REMOTE_CMD}" \
            | gzip > "${BACKUP_FILE}"
          if [ ! -s "${BACKUP_FILE}" ]; then
            echo "Database backup file is empty: ${BACKUP_FILE}" >&2
            exit 1
          fi
          echo "BACKUP_FILE=${BACKUP_FILE}" >> "${GITHUB_ENV}"
        shell: bash

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 30
